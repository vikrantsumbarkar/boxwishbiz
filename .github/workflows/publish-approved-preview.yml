name: Publish approved preview updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message != 'Publish approved preview updates'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy approved Preview files
        run: |
          set -e
          base="https://raw.githubusercontent.com/vikrantsumbarkar/boxwishbiz-preview/main"
          for file in index.html request-quote.html catalogue-request.html sample-request.html styles.css; do
            curl -fsSL "$base/$file" -o "$file"
          done

      - name: Commit and push approved files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html request-quote.html catalogue-request.html sample-request.html styles.css
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish approved preview updates"
          git push origin main
