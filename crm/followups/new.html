<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Follow-up — Boxwish Biz CRM</title><link rel="icon" href="../../favicon.png"><link rel="stylesheet" href="../crm.css"></head><body><div class="app"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-mark">BOXWISH <span>BIZ</span></div><small>CRM</small></div><nav><a class="nav-item" href="../#dashboard">⌂ <span>Dashboard</span></a><a class="nav-item" href="../#enquiries">▣ <span>Enquiries</span></a><a class="nav-item" href="../#clients">♙ <span>Clients</span></a><a class="nav-item" href="../#quotations">▤ <span>Quotations</span></a><a class="nav-item" href="../#fir">◈ <span>FIR</span></a><a class="nav-item" href="../#lpa">✓ <span>LPA</span></a><a class="nav-item" href="../#sas">▧ <span>SAS</span></a><a class="nav-item" href="../#orders">▦ <span>Orders</span></a><a class="nav-item active" href="../#followups">◷ <span>Follow Ups</span></a><a class="nav-item" href="../#documents">□ <span>Documents</span></a></nav><div class="sidebar-bottom"><a class="nav-item" href="../#profile">⚙ <span>Profile</span></a></div></aside><main class="main"><header class="topbar"><a href="../#followups" class="btn secondary">← Back</a><div><div class="eyebrow">Boxwish Biz CRM</div><h2>Schedule Follow-up</h2></div><div class="user-chip"><span class="avatar">BW</span><div><strong id="topName">Employee</strong><small id="topRole">Sales</small></div></div></header><section class="page active-page"><div class="page-intro"><div><h1>Schedule Follow-up</h1><p>Record the next action so every enquiry keeps moving.</p></div></div><form id="followForm" class="form-grid"><div class="form-section"><h3>Enquiry</h3><div class="form-cols"><label>Enquiry ID *<input id="enquiryId" name="enquiry_id" readonly required class="readonly-input"></label><label>Client / Company<input id="clientName" name="client_name" readonly class="readonly-input"></label></div></div><div class="form-section"><h3>Follow-up Details</h3><div class="form-cols"><label>Follow-up Date *<input type="date" name="followup_date" id="followupDate" required></label><label>Time<input type="time" name="followup_time"></label><label>Type *<select name="followup_type" required><option>Call</option><option>Email</option><option>Meeting</option><option>WhatsApp</option><option>Visit</option><option>Other</option></select></label><label>Status<select name="status"><option selected>Pending</option><option>Completed</option><option>Rescheduled</option></select></label></div><label>Notes / Next Action *<textarea name="notes" rows="5" required placeholder="What needs to be discussed or done next?"></textarea></label></div><div class="form-section"><h3>Assignment</h3><div class="form-cols"><label>Assigned To<input id="assignedName" class="readonly-input" readonly></label><input type="hidden" name="assigned_to" id="assignedTo"></div></div><div class="modal-actions"><a class="btn secondary" id="cancelLink" href="../#followups">Cancel</a><button class="btn primary" type="submit">Schedule Follow-up</button></div></form></section></main></div><div id="toast" class="toast"></div><script>(function(){const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},write=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),today=()=>new Date().toISOString().slice(0,10),now=()=>new Date().toISOString(),id=new URLSearchParams(location.search).get('enquiry');const en=read('boxwishCrmEnquiries').find(x=>x.enquiry_id===id);if(!en){alert('Enquiry not found');location.href='../#followups';return}document.getElementById('enquiryId').value=en.enquiry_id;document.getElementById('clientName').value=(en.company||'')+' · '+(en.contact_person||'');const d=new Date();d.setDate(d.getDate()+1);document.getElementById('followupDate').value=d.toISOString().slice(0,10);let user={};try{user=JSON.parse(sessionStorage.getItem('crmDevUser')||'{}')}catch(e){}const who=user.name||user.id||'Employee';document.getElementById('assignedName').value=who;document.getElementById('assignedTo').value=user.id||who;document.getElementById('topName').textContent=who;document.getElementById('topRole').textContent=user.role||'Sales';document.getElementById('followForm').addEventListener('submit',function(ev){ev.preventDefault();const o=Object.fromEntries(new FormData(this).entries());o.followup_id='BW-FU-'+Date.now();o.client_id=(read('boxwishCrmClients').find(c=>c.mobile===en.mobile)||{}).client_id||'';o.created_at=now();o.completed_date='';const arr=read('boxwishCrmFollowUps');arr.unshift(o);write('boxwishCrmFollowUps',arr);en.next_followup_date=o.followup_date;en.next_followup_type=o.followup_type;en.next_followup_notes=o.notes;en.updated_at=now();const all=read('boxwishCrmEnquiries');const i=all.findIndex(x=>x.enquiry_id===en.enquiry_id);if(i>=0)all[i]=en;write('boxwishCrmEnquiries',all);const acts=read('boxwishCrmActivities');acts.unshift({enquiry_id:en.enquiry_id,client_id:o.client_id,activity_type:'Follow-up Scheduled',description:o.followup_type+' scheduled for '+o.followup_date+(o.followup_time?' at '+o.followup_time:'')+' — '+o.notes,performed_by:who,created_at:now()});write('boxwishCrmActivities',acts);location.href='../enquiries/detail.html?id='+encodeURIComponent(en.enquiry_id)})})();</script></body></html>
