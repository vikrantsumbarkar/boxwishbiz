<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiry Detail — Boxwish Biz CRM</title>
<link rel="icon" href="../../favicon.png"><link rel="stylesheet" href="../crm.css">
<style>.detail-grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px}.detail-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.detail-card h3{margin:0 0 16px}.detail-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.field strong{font-size:14px;line-height:1.45}.workflow{display:flex;align-items:center;gap:0;overflow:auto;padding:8px 0 16px}.step{min-width:115px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}.step-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin:0 auto 7px;background:#f1f3f6;border:2px solid var(--line)}.step.done .step-dot,.step.current .step-dot{background:var(--soft);border-color:var(--orange);color:var(--navy)}.step.current{color:var(--navy)}.connector{height:2px;min-width:24px;background:var(--line)}.notes{white-space:pre-wrap;color:#394257;line-height:1.6}.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.timeline{display:grid;gap:0}.timeline-item{position:relative;padding:0 0 18px 24px;border-left:2px solid var(--line)}.timeline-item:last-child{border-left-color:transparent}.timeline-item:before{content:'';position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--orange)}.timeline-item strong{font-size:13px}.timeline-item small{display:block;color:var(--muted);margin-top:4px}.empty-detail{color:var(--muted);padding:30px 0;text-align:center}@media(max-width:850px){.detail-grid{grid-template-columns:1fr}.detail-row{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="sidebar-brand"><div class="brand-mark">BOXWISH <span>BIZ</span></div><small>CRM</small></div><nav><a class="nav-item" href="../#dashboard">⌂ <span>Dashboard</span></a><a class="nav-item active" href="../#enquiries">▣ <span>Enquiries</span></a><a class="nav-item" href="../#clients">♙ <span>Clients</span></a><a class="nav-item" href="../#quotations">▤ <span>Quotations</span></a><a class="nav-item" href="../#fir">◈ <span>FIR</span></a><a class="nav-item" href="../#lpa">✓ <span>LPA</span></a><a class="nav-item" href="../#sas">▧ <span>SAS</span></a><a class="nav-item" href="../#orders">▦ <span>Orders</span></a><a class="nav-item" href="../#followups">◷ <span>Follow Ups</span></a><a class="nav-item" href="../#documents">□ <span>Documents</span></a></nav><div class="sidebar-bottom"><a class="nav-item" href="../#profile">⚙ <span>Profile</span></a></div></aside><main class="main"><header class="topbar"><a href="../#enquiries" class="btn secondary">← Back</a><div><div class="eyebrow">Boxwish Biz CRM</div><h2>Enquiry Detail</h2></div><div class="user-chip"><span class="avatar">BW</span><div><strong>Employee</strong><small>Sales</small></div></div></header><section class="page active-page" id="detailPage"><div class="empty-detail">Loading enquiry…</div></section></main></div>
<script>(function(){const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(v+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—',money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2}),id=new URLSearchParams(location.search).get('id'),e=read('boxwishCrmEnquiries').find(x=>x.enquiry_id===id),clients=read('boxwishCrmClients'),c=e&&clients.find(x=>x.mobile===e.mobile||((x.company||'').toLowerCase()===(e.company||'').toLowerCase())),page=document.getElementById('detailPage');if(!e){page.innerHTML='<div class="panel"><h2>Enquiry not found</h2><p class="muted">This enquiry may have been deleted or the link is invalid.</p><a class="btn secondary" href="../#enquiries">← Back to Enquiries</a></div>';return}const stages=['Open','Qualified','Quotation Sent','Negotiation','Won/Lost'],si=e.status==='Lost'?4:Math.max(0,stages.indexOf(e.status)),steps=stages.map((s,i)=>`<div class="step ${i<si?'done':''} ${i===si?'current':''}"><div class="step-dot">${i<si?'✓':i+1}</div>${s}</div>${i<stages.length-1?'<div class="connector"></div>':''}`).join('');page.innerHTML=`<div class="page-intro"><div><div class="eyebrow">${esc(e.status||'Open')} · ${esc(e.priority||'Medium')} Priority</div><h1>${esc(e.enquiry_id)}</h1><p>${esc(e.company)} · ${esc(e.contact_person)}</p></div><div class="action-row"><a class="btn secondary" href="../#enquiries">← Enquiries</a><a class="btn secondary" href="new.html?edit=${encodeURIComponent(e.enquiry_id)}">Edit Enquiry</a><button class="btn primary" type="button" id="quoteBtn">Create Quotation</button></div></div><div class="detail-grid"><div class="detail-card"><h3>Enquiry Summary</h3><div class="detail-row"><div class="field"><span>Company</span><strong>${esc(e.company)}</strong></div><div class="field"><span>Contact Person</span><strong>${esc(e.contact_person)}</strong></div><div class="field"><span>Mobile</span><strong>${esc(e.mobile)}</strong></div><div class="field"><span>Email</span><strong>${esc(e.email)||'—'}</strong></div><div class="field"><span>Designation</span><strong>${esc(e.designation)||'—'}</strong></div><div class="field"><span>Department</span><strong>${esc(e.department)||'—'}</strong></div><div class="field"><span>City</span><strong>${esc(e.city)||'—'}</strong></div><div class="field"><span>Industry</span><strong>${esc(e.industry)||'—'}</strong></div><div class="field"><span>Gifting Type</span><strong>${esc(e.gifting_type)}</strong></div><div class="field"><span>Product Category</span><strong>${esc(e.product_category)}</strong></div><div class="field"><span>Quantity</span><strong>${e.approx_quantity||'—'}</strong></div><div class="field"><span>Budget / Piece</span><strong>${money(e.budget_per_piece)}</strong></div><div class="field"><span>Expected Order Value</span><strong>${money(e.expected_order_value)}</strong></div><div class="field"><span>Expected Delivery</span><strong>${fmt(e.expected_delivery_date)}</strong></div><div class="field"><span>Branding Required</span><strong>${esc(e.branding_required)||'—'}</strong></div><div class="field"><span>Lead Source</span><strong>${esc(e.lead_source)||'—'}</strong></div></div></div><div class="detail-card"><h3>Client Master</h3><div class="detail-row"><div class="field"><span>Client ID</span><strong>${esc(c&&c.client_id)||'—'}</strong></div><div class="field"><span>GST Number</span><strong>${esc(c&&c.gst_number)||'—'}</strong></div><div class="field" style="grid-column:1/-1"><span>Address</span><strong>${esc(c&&c.address)||'—'}</strong></div></div><div class="action-row"><a class="btn secondary" href="../#clients">View Client Master</a></div></div><div class="detail-card" style="grid-column:1/-1"><h3>Workflow Status</h3><div class="workflow">${steps}</div></div><div class="detail-card"><h3>Requirement Details</h3><div class="notes">${esc(e.product_details)||'No requirement details added.'}</div></div><div class="detail-card"><h3>Discussion Notes</h3><div class="notes">${esc(e.discussion_notes)||'No discussion notes added.'}</div></div><div class="detail-card" style="grid-column:1/-1"><h3>Activity Timeline</h3><div class="timeline"><div class="timeline-item"><strong>Enquiry created</strong><small>${fmt(e.inquiry_date)} · ${esc(e.lead_source||'CRM')}</small></div>${e.updated_at&&e.updated_at!==e.created_at?`<div class="timeline-item"><strong>Enquiry updated</strong><small>${new Date(e.updated_at).toLocaleString('en-IN')}</small></div>`:''}<div class="timeline-item"><strong>Current status: ${esc(e.status||'Open')}</strong><small>Priority: ${esc(e.priority||'Medium')}</small></div></div></div><div class="detail-card" style="grid-column:1/-1"><h3>Next Action</h3><p class="muted">No follow-up has been scheduled yet.</p><div class="action-row"><button class="btn secondary" type="button" id="followBtn">Schedule Follow-up</button><button class="btn primary" type="button" id="firBtn">Create FIR</button></div></div>`;document.getElementById('quoteBtn').onclick=()=>alert('Quotation module will be linked here next.');document.getElementById('followBtn').onclick=()=>alert('Follow-up module will be linked here next.');document.getElementById('firBtn').onclick=()=>alert('FIR module will be linked here next.');})();</script>
<script src="enquiry-detail-enhance.js?v=20260909-4"></script></body></html>
